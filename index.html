<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Video Host</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --text-heading: #f0f6fc;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --code-bg: #010409;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      color: var(--text-heading);
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 0.95rem;
      color: #8b949e;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.25rem;
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--text-heading);
      margin-bottom: 0.75rem;
    }

    /* Video Player */
    .video-container {
      width: 100%;
      background-color: #000;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* URL Box & Button */
    .url-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      color: #58a6ff;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
    }

    button {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    /* Code Embed Example */
    pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      color: #79c0ff;
      font-size: 0.85rem;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>GitHub Pages Video Hosting</h1>
      <p>Direct MP4 Streaming URL</p>
    </header>

    <!-- Video Preview Card -->
    <section class="card">
      <h2>Video Preview</h2>
      <div class="video-container">
        <video id="player" controls preload="metadata">
          <source id="video-source" src="video1.mp4" type="video/mp4">
          Your browser does not support HTML5 video playback.
        </video>
      </div>
    </section>

    <!-- Direct URL Card -->
    <section class="card">
      <h2>Direct Video URL</h2>
      <div class="url-box">
        <input type="text" id="video-url-input" readonly>
        <button id="copy-btn">Copy Video URL</button>
      </div>

      <h2>Embed Code (For External Websites)</h2>
      <pre><code id="embed-code"></code></pre>
    </section>

    <footer>
      Hosted via GitHub Pages • Public Direct Access
    </footer>
  </div>

  <script>
    // -------------------------------------------------------------
    // SETUP: Set your GitHub details here
    // -------------------------------------------------------------
    const GITHUB_USERNAME = "YOUR-USERNAME";
    const GITHUB_REPO = "YOUR-REPOSITORY";
    const VIDEO_FILENAME = "video1.mp4";

    // Build the Direct URL format: https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/video1.mp4
    let directVideoUrl = `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/${VIDEO_FILENAME}`;

    // If viewing directly on GitHub Pages, auto-detect the current URL
    if (window.location.hostname.endsWith('github.io')) {
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      directVideoUrl = baseUrl + VIDEO_FILENAME;
    }

    // Populate Input Box
    const urlInput = document.getElementById('video-url-input');
    urlInput.value = directVideoUrl;

    // Populate Embed Code Box
    const embedCode = document.getElementById('embed-code');
    embedCode.textContent = `<video controls width="100%">\n  <source src="${directVideoUrl}" type="video/mp4">\n</video>`;

    // Copy Button Functionality
    const copyBtn = document.getElementById('copy-btn');
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(directVideoUrl);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "Copied!";
        copyBtn.style.backgroundColor = "#1f6feb";

        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.backgroundColor = "";
        }, 2000);
      } catch (err) {
        // Fallback for older browser compatibility
        urlInput.select();
        document.execCommand('copy');
        alert("URL copied to clipboard!");
      }
    });
  </script>
</body>
</html>
