<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShare - Upload & Share Files</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .upload-box {
            border: 2px dashed var(--border);
            padding: 2rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: border-color 0.2s;
            margin-bottom: 1.5rem;
        }

        .upload-box:hover {
            border-color: var(--primary);
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            cursor: pointer;
            font-weight: 500;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #result {
            margin-top: 1.5rem;
            display: none;
            text-align: left;
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 0.5rem;
            word-break: break-all;
        }

        #result a {
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
        }

        #result a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>QuickShare</h2>
        <p>Upload Images, Videos, or APKs instantly and get a shareable link.</p>
        
        <form id="uploadForm">
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <label class="file-label" id="fileLabel">📁 Choose file from device</label>
                <input type="file" id="fileInput" required>
            </div>
            <button type="submit" id="uploadBtn" disabled>Upload & Get Link</button>
        </form>

        <div id="result">
            <strong>Shareable Link:</strong><br>
            <a id="shareLink" href="#" target="_blank"></a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadForm = document.getElementById('uploadForm');
        const resultDiv = document.getElementById('result');
        const shareLink = document.getElementById('shareLink');

        // Update label text when a file is chosen
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileLabel.textContent = `Selected: ${fileInput.files[0].name}`;
                uploadBtn.disabled = false;
            }
        });

        // Handle form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            uploadBtn.textContent = 'Uploading...';
            uploadBtn.disabled = true;

            try {
                // Change '/upload' to match your backend endpoint URL
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.style.display = 'block';
                    shareLink.href = data.url;
                    shareLink.textContent = data.url;
                    uploadBtn.textContent = 'Upload Success!';
                } else {
                    alert(data.message || 'Upload failed.');
                    uploadBtn.textContent = 'Upload & Get Link';
                    uploadBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred during upload.');
                uploadBtn.textContent = 'Upload & Get Link';
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
