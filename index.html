<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video API Demo</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --code-bg: #020617;
      --border-color: #334155;
      --error-color: #ef4444;
      --success-color: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background-color: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .status-msg {
      display: none;
      padding: 1rem;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error-color);
      color: var(--error-color);
      border-radius: 6px;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .api-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .copy-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .copy-btn:hover {
      background-color: var(--accent-hover);
    }

    pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      color: #38bdf8;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Video API Demo</h1>
      <p>Static JSON API Endpoint on GitHub Pages</p>
    </header>

    <!-- Video Player Section -->
    <section class="card">
      <h2>Media Player</h2>
      <div class="video-wrapper">
        <video id="video-player" controls preload="metadata">
          <source id="video-source" src="" type="video/mp4">
          Your browser does not support playing this video.
        </video>
      </div>
      <div id="status-msg" class="status-msg"></div>
    </section>

    <!-- API Data Section -->
    <section class="card">
      <div class="api-header">
        <h2>Fetched API Response (`video1.json`)</h2>
        <button class="copy-btn" id="copy-btn">Copy Video API URL</button>
      </div>
      <pre><code id="json-display">Loading API data...</code></pre>
    </section>

    <footer>
      <p>Hosted on GitHub Pages • Static JSON API</p>
    </footer>
  </div>

  <script>
    // Relative path to static JSON endpoint
    const API_ENDPOINT = './video1.json';

    const player = document.getElementById('video-player');
    const source = document.getElementById('video-source');
    const jsonDisplay = document.getElementById('json-display');
    const statusMsg = document.getElementById('status-msg');
    const copyBtn = document.getElementById('copy-btn');

    // Fetch video information dynamically from video1.json
    async function loadVideoApi() {
      try {
        const response = await fetch(API_ENDPOINT);
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

        // 1. Display JSON output in UI
        jsonDisplay.textContent = JSON.stringify(data, null, 2);

        // 2. Set video source dynamically from JSON response
        source.src = data.video_url || data.file;
        player.load();

      } catch (err) {
        console.error('Failed to fetch video1.json:', err);
        jsonDisplay.textContent = '// Failed to load video1.json';
        statusMsg.style.display = 'block';
        statusMsg.innerHTML = `⚠️ <strong>Error fetching API data:</strong> Make sure <code>video1.json</code> exists in the same repository root directory.`;
      }
    }

    // Copy absolute API URL (video1.json full URL) to clipboard
    copyBtn.addEventListener('click', async () => {
      // Get the full absolute URL for external fetch access
      const absoluteApiUrl = new URL(API_ENDPOINT, window.location.href).href;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(absoluteApiUrl);
        } else {
          // Fallback for older browsers or non-HTTPS local environments
          const textarea = document.createElement('textarea');
          textarea.value = absoluteApiUrl;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }

        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'URL Copied!';
        copyBtn.style.backgroundColor = 'var(--success-color)';

        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.backgroundColor = '';
        }, 2000);
      } catch (err) {
        alert('Failed to copy URL: ' + err);
      }
    });

    // Initialize on page load
    loadVideoApi();
  </script>

</body>
</html>
