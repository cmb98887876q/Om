<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video API Demo</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --code-bg: #020617;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: var(--text-color);
    }

    /* Video Player Styles */
    .video-wrapper {
      position: relative;
      width: 100%;
      background-color: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* API Section Styles */
    .api-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .copy-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .copy-btn:hover {
      background-color: var(--accent-hover);
    }

    pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: "Courier New", Courier, monospace;
      color: #38bdf8;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Video API Demo</h1>
      <p>Static API Data & Responsive Video Player</p>
    </header>

    <!-- Video Player Section -->
    <section class="card">
      <h2>Media Preview</h2>
      <div class="video-wrapper">
        <video id="video-player" controls preload="metadata">
          <source src="video1.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </section>

    <!-- API Data Section -->
    <section class="card">
      <div class="api-header">
        <h2>Video API Object Data</h2>
        <button class="copy-btn" id="copy-btn">Copy API Data</button>
      </div>
      <pre><code id="json-display"></code></pre>
    </section>

    <footer>
      <p>Single-file static demo • Ready for backend integration</p>
    </footer>
  </div>

  <script>
    // Client-side API Data Structure
    const videoData = {
      title: "Video 1",
      file: "video1.mp4",
      video_url: "video1.mp4"
    };

    // Render JSON to code block
    const jsonDisplay = document.getElementById('json-display');
    jsonDisplay.textContent = JSON.stringify(videoData, null, 2);

    // Copy Button Functionality
    const copyBtn = document.getElementById('copy-btn');
    copyBtn.addEventListener('click', () => {
      const jsonText = JSON.stringify(videoData, null, 2);
      
      navigator.clipboard.writeText(jsonText).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        copyBtn.style.backgroundColor = '#22c55e'; // Success green

        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.backgroundColor = '';
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy API data: ', err);
      });
    });
  </script>

</body>
</html>
