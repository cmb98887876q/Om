<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video API Demo</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --code-bg: #020617;
      --border-color: #334155;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background-color: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .error-msg {
      display: none;
      padding: 1rem;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error-color);
      color: var(--error-color);
      border-radius: 6px;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .api-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .copy-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .copy-btn:hover {
      background-color: var(--accent-hover);
    }

    pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      color: #38bdf8;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Video API Demo</h1>
      <p>Static API Data & Responsive Video Player</p>
    </header>

    <!-- Video Player Section -->
    <section class="card">
      <h2>Media Player</h2>
      <div class="video-wrapper">
        <video id="video-player" controls preload="metadata">
          <source id="video-source" src="" type="video/mp4">
          Browser video play nahi kar pa raha hai.
        </video>
      </div>
      <div id="video-error" class="error-msg">
        ⚠️ <strong>video1.mp4 load nahi ho paya!</strong><br>
        Check karein ki 'video1.mp4' file bilkul same folder me 'index.html' ke sath rakhi hai ya nahi.
      </div>
    </section>

    <!-- API Data Section -->
    <section class="card">
      <div class="api-header">
        <h2>Video API Object Data</h2>
        <button class="copy-btn" id="copy-btn">Copy API Data</button>
      </div>
      <pre><code id="json-display"></code></pre>
    </section>

    <footer>
      <p>Single-file static demo • Ready for backend integration</p>
    </footer>
  </div>

  <script>
    // 1. JavaScript API-style Object Data
    const videoData = {
      title: "Video 1",
      file: "video1.mp4",
      video_url: "video1.mp4"
    };

    // 2. Set Video Source from API Object
    const player = document.getElementById('video-player');
    const source = document.getElementById('video-source');
    const errorMsg = document.getElementById('video-error');

    source.src = videoData.video_url;
    player.load(); // Reload video with new src

    // Error detection if video fails to load
    player.addEventListener('error', () => {
      errorMsg.style.display = 'block';
    }, true);

    // 3. Display JSON Object
    const jsonDisplay = document.getElementById('json-display');
    jsonDisplay.textContent = JSON.stringify(videoData, null, 2);

    // 4. Copy API Data Functionality
    const copyBtn = document.getElementById('copy-btn');
    copyBtn.addEventListener('click', async () => {
      const jsonText = JSON.stringify(videoData, null, 2);
      
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(jsonText);
        } else {
          // Fallback for older browsers or file:// protocol
          const textarea = document.createElement('textarea');
          textarea.value = jsonText;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }

        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        copyBtn.style.backgroundColor = '#22c55e'; // Green

        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.backgroundColor = '';
        }, 2000);
      } catch (err) {
        alert('Copy nahi ho paya: ' + err);
      }
    });
  </script>

</body>
</html>
